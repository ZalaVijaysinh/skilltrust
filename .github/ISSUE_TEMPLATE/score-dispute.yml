name: This score is wrong
description: A skill's score, risk level or listed abilities look wrong.
title: "Score: "
body:
  - type: input
    id: page
    attributes:
      label: Skill page
      description: The SkillTrust page of the skill, e.g. https://zalavijaysinh.github.io/skilltrust/skills/owner__repo__path/
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Which ability or line is wrongly flagged, or what the scan missed. Link to the exact lines on GitHub.
    validations:
      required: true
  - type: dropdown
    id: author
    attributes:
      label: Are you the skill's author or a maintainer of its repository?
      options: ["Yes", "No"]
    validations:
      required: true
