name: Bug report
description: Something on the site, in the finder or in the scanner does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the page URL or the agent you used the finder in.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error messages, browser or agent version.
