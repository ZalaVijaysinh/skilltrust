name: scan
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # a queued run must start from the data the previous run pushed, not the commit it was triggered on
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan
        timeout-minutes: 300
        env:
          SKILLTRUST_TOKEN: ${{ secrets.SKILLTRUST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        if: always()
        # push credentials live only in this step; checkout keeps none
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name skilltrust-bot
          git config user.email skilltrust-bot@users.noreply.github.com
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: daily scan $(date -u +%F)"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            for i in 1 2 3; do
              # on a data conflict keep this run's files (-X theirs = the commit being replayed), then rebuild the index from the union
              if git pull --rebase -X theirs --autostash; then
                npm run rebuild-index
                git add data
                git diff --cached --quiet || git commit -m "data: rebuild index after merge"
                git push && exit 0
              else
                git rebase --abort || true
              fi
            done
            exit 1
          fi
