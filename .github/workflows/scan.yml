name: scan
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan
        timeout-minutes: 300
        env:
          SKILLTRUST_TOKEN: ${{ secrets.SKILLTRUST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        if: always()
        # push credentials live only in this step; checkout keeps none
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name skilltrust-bot
          git config user.email skilltrust-bot@users.noreply.github.com
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: daily scan $(date -u +%F)"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
            done
            exit 1
          fi
