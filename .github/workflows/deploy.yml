name: deploy
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scanner/src/rules.ts"
      - "scanner/src/score.ts"
      - "scanner/src/trending.ts"
      - "scanner/src/stars.ts"
      - "scanner/src/records.ts"
  # Pushes made with GITHUB_TOKEN (the scan's data commit) do not trigger other workflows.
  workflow_run:
    workflows: ["scan"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_run's own sha is the commit the scan started from; we want the data it pushed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
